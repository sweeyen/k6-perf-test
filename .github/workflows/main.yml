name: Docker Workflow
on: [push]
      
jobs:
  k6_local_test:
    name: k6 performance test docker
    runs-on: ubuntu-latest
    container:
      image: grafana/k6:latest
      options: --user 0
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: create Result
        run: apk update && apk add --no-cache sudo && mkdir -p Result      
        
      - name: Local k6 test
        run: k6 run GetUserTest.js
